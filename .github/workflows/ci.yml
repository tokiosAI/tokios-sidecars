name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    strategy:
      # An infra flake on one OS (e.g. a NuGet network error) must not cancel the other legs' signal.
      fail-fast: false
      matrix:
        # The ChatGPT sidecar's tests drive the JSON-RPC client over anonymous pipes, and the codex
        # `.cmd`-shim resolution is Windows-only code, so all three OSes carry signal.
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build TokiosSidecars.sln -c Release

      - name: Test
        run: dotnet test TokiosSidecars.sln -c Release --no-build --logger "console;verbosity=normal"
